name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'lapanlima'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [gts7fewifi]

    steps:
      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Checkout repo (fast sparse checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          submodules: 'recursive'
          sparse-checkout: |
            .github
            external
            platform/sm7325
            scripts
            security
            target/gts7fewifi
            unica
            prebuilts/samsung/a17xxx
            prebuilts/samsung/a56xnaxx
            prebuilts/samsung/a73xqxx
            prebuilts/samsung/b0qxxx
            prebuilts/samsung/b4qxxx
            prebuilts/samsung/dm1qxxx
            prebuilts/samsung/dm3qxxx
            prebuilts/samsung/gta9pxxx
            prebuilts/samsung/m3qxxx
            prebuilts/samsung/pa2qxxx
            prebuilts/samsung/r11sxxx
            prebuilts/samsung/r9qxxx
            prebuilts/samsung/r9sxxx

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${{ secrets.PLATFORM_KEY_PK8 }}" ]; then
            echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
            echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: ./scripts/make_rom.sh

      - name: Upload patch reject files (on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejects-${{ matrix.target }}-${{ github.run_id }}
          path: |
            out/target/${{ matrix.target }}/apktool/**/*.rej
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload to GoFile & Artifacts
        run: |
          ZIP_FILE=$(find out -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found in out/ directory!"
            exit 1
          fi

          echo "Found file: $ZIP_FILE"
          md5sum "$ZIP_FILE"
          sha256sum "$ZIP_FILE"

          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name // "store1"')
          echo "Starting upload to GoFile ($SERVER)..."
          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" "https://${SERVER}.gofile.io/contents/uploadfile")
          echo "Uploaded successfully! Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'
